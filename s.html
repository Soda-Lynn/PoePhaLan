<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amhattaya | Opening Your Gift</title>
    
    <meta property="og:title" content="Amhattaya - A Digital Gift for You" />
    <meta property="og:description" content="Click to open your interactive digital gift!" />
    <meta property="og:image" content="https://amhattaya.onrender.com/imgs/pre.png" />
    <meta property="og:type" content="website" />

    <style>
        body { margin: 0; background: #387a99; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; }
        .loader-box-inner { 
            width: 60px; height: 60px; border: 4px solid black; background: #73ff00; 
            box-shadow: 6px 6px 0px 0px black; 
            animation: loader-morph 2s infinite cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        @keyframes loader-morph {
            0% { transform: rotate(0deg) scale(1); border-radius: 0%; }
            50% { transform: rotate(180deg) scale(1.2); border-radius: 50%; background: #ff00ff; }
            100% { transform: rotate(360deg) scale(1); border-radius: 0%; }
        }
    </style>
</head>
<body>

    <div class="loader-box-inner"></div>
    <p style="margin-top: 20px; font-weight: bold; letter-spacing: 1px;">OPENING GIFT...</p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://maaamwkvejsotgbxzcrb.supabase.co';
        const supabaseKey = 'sb_publishable_bg6cykO5tEPhTeeiSuv2Zw_f5SXD1v3'; 
        
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function getGift() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                window.location.href = 'index.html';
                return;
            }

            const { data, error } = await _supabase
                .from('links')
                .select('original_url, type')
                .eq('id', id)
                .single();

            if (data && data.original_url) {
                const targetPage = data.type === 'foodbox' ? 'preview_foodbox.html' : 'preview.html';
                
                window.location.href = `${targetPage}?data=${data.original_url}`;
            } else {
                document.body.innerHTML = "<h1>Gift not found!</h1><p>Check the link and try again.</p>";
            }
        }

        getGift();
    </script>
</body>
</html>
