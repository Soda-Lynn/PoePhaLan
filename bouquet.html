<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouquet Studio</title>
    
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Amhattaya" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="application-name" content="Amhattaya" />
    <meta name="description" content="Design your own interactive digital bouquet. Pick your flowers, add a message, and share the love." />

    <script src="https://cdn.tailwindcss.com"></script>

    <meta property="og:title" content="Amhattaya - Bouquet Studio" />
    <meta property="og:site_name" content="Amhattaya" />
    <meta
      property="og:description"
      content="Create a custom handcrafted digital bouquet for your loved ones."
    />
    <meta
      property="og:image"
      content="https://amhattaya.onrender.com/rose.png"
    />
    <meta property="og:url" content="https://amhattaya.onrender.com/bouquet.html" />
    <meta property="og:type" content="website" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Amhattaya - Bouquet Studio",
        "url": "https://amhattaya.onrender.com/bouquet.html",
        "description": "Interactive studio for creating 3D digital flower bouquets."
      }
    </script>
    <link rel="stylesheet" href="bouquet.css" /> 
    


</head>
<body>

    <div class="grid-bg"></div>

    <div class="page-shell">
        <header>
            <div class="logo-area animate-entry" style="animation-delay: 0.1s; cursor:pointer" onclick="location.href='index.html'">
                <h1><img src="imgs/logo.svg" alt="Logo" class="w-6 h-6 inline-block mr-2">Amhattaya</h1>
            </div>
            <button class="menu-toggle animate-entry" id="menuToggle" style="animation-delay: 0.2s;">
                <span></span><span></span><span></span>
            </button>
            <nav class="navbar animate-entry" id="navMenu" style="animation-delay: 0.2s;">
                <a href="index.html">Home</a>
                <div class="dropdown" id="servicesDropdown">
                    <span class="dropdown-trigger" onclick="toggleDropdown(event)">Services</span>
                    <div class="dropdown-menu">
                        <a href="bouquet.html" class="dropdown-item">Bouquet Studio</a>
                        <a href="foodbox.html" class="dropdown-item">Food Box Studio</a>
                    </div>
                </div>
                <a href="about.html" class="nav-link">About</a>
                <a href="feedback.html" class="nav-link">Feedback</a>
            </nav>
        </header>

        <div id="selection-section" class="section">
            <div id="limit-warning" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[100] bg-red-500 text-white text-xl px-8 py-4 font-black animate-bounce hidden rounded-xl border-4 border-black shadow-[8px_8px_0_0_rgba(0,0,0,1)]">MAX 12 FLOWERS!</div>
        <div class="max-w-6xl mx-auto mb-auto">
            <h2 class="text-xl font-black uppercase mb-8 text-center">Pick Your Blooms (Max 12)</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-6" id="flower-grid"></div>
        </div>
        <div class="flex justify-center mt-10">
            <button onclick="scrollToBuilder()" class="neo-btn px-10 py-3 text-lg bg-yellow-300">CONTINUE TO STUDIO ➔</button>
        </div>
    </div>

    <div id="builder-section" class="section">
        <div class="builder-outer" id="main-builder">
            <div class="canvas-area">
                <div class="flower-counter" id="flower-counter">FLOWERS: 0 / 12</div>
                <div id="bouquet-wrapper" class="transition-all duration-500">
                    <div id="bouquet-container">
                        <img id="wrap-back-img" src="imgs/wrap_back_1.svg" alt="back wrap">
                        <div id="flower-layer"></div>
                        <img id="wrap-front-img" src="imgs/wrap_front_1.svg" alt="front wrap">
                    </div>
                </div>
                <div class="gift-card rounded-lg">
                    <input type="text" id="msg-to" class="w-full font-black text-[10px] outline-none" placeholder="To: Dear Someone">
                    <textarea id="msg-body" class="handwriting" placeholder="Write something sweet..."></textarea>
                    <input type="text" id="msg-from" class="w-full font-black text-[10px] text-right outline-none" placeholder="- Your Lovely">
                </div>
            </div>
            <div class="builder-chin">
                <div class="flex gap-4">
                    <button onclick="changeWrap()" class="neo-btn">CHANGE WRAP</button>
                    <button onclick="toggleMessage()" class="neo-btn bg-cyan-300">MESSAGE</button>
                    <button onclick="arrangeEverything()" class="neo-btn bg-yellow-300">ARRANGE</button>
                </div>
                <div class="flex gap-4 items-center ml-auto">
                    <button onclick="resetBouquet()" class="neo-btn bg-red-500 text-white border-white">RESET</button>
                    <button onclick="goToPreview()" class="neo-btn bg-green-400 finish-btn-circle">FINISH &<br>PREVIEW</button>
                </div>
            </div>
        </div>
    </div>
    </div>


    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');
        const servicesDropdown = document.getElementById('servicesDropdown');

        function toggleDropdown(e) {
            e.stopPropagation();
            servicesDropdown.classList.toggle('active');
        }

        window.addEventListener('click', () => {
            servicesDropdown.classList.remove('active');
        });

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        window.addEventListener('mousemove', e => {
            document.documentElement.style.setProperty('--m-x', `${e.clientX}px`);
            document.documentElement.style.setProperty('--m-y', `${e.clientY}px`);
        });

        const FLOWERS = [
            { id: 'rose', name: 'Rose', color: '#ff9494', img: 'imgs/rose.svg', meaning: 'Love & Passion' },
            { id: 'sunflower', name: 'Sunflower', color: '#ffdb58', img: 'imgs/sunflower.svg', meaning: 'Adoration & Loyalty' },
            { id: 'tulip', name: 'Tulip', color: '#ffb7ff', img: 'imgs/tulip.svg', meaning: 'Perfect Love' },
            { id: 'lily', name: 'Lily', color: '#ffffff', img: 'imgs/lily.svg', meaning: 'Purity & Rebirth' },
            { id: 'carnation', name: 'Carnation', color: '#ffcaaf', img: 'imgs/carnation.svg', meaning: 'Devotion & Distinction' },
            { id: 'orchid', name: 'Orchid', color: '#c3aaff', img: 'imgs/orchid.svg', meaning: 'Strength & Beauty' },
            { id: 'daisy', name: 'Daisy', color: '#fef3c7', img: 'imgs/daisy.svg', meaning: 'Innocence & New Starts' },
            { id: 'daffodil', name: 'Daffodil', color: '#fff700', img: 'imgs/daffodil.svg', meaning: 'New Beginnings' },
            { id: 'lilac', name: 'Lilac', color: '#dcd0ff', img: 'imgs/lilac.svg', meaning: 'First Emotions of Love' },
            { id: 'baby_breath', name: "Baby's Breath", color: '#ffffff', img: 'imgs/baby_breath.svg', meaning: 'Everlasting Love' },
            { id: 'lavender', name: 'Lavender', color: '#e6e6fa', img: 'imgs/lavender.svg', meaning: 'Serenity & Grace' }
        ];

        let bouquet = [];
        const MAX_FLOWERS = 12;
        let wrapIdx = 1;

        const grid = document.getElementById('flower-grid');
        FLOWERS.forEach(f => {
            const card = document.createElement('div');
            card.className = 'card-container';
            card.id = `container-${f.id}`;
            card.innerHTML = `
                <button class="flip-btn" onmouseover="toggleFlip('${f.id}')" onmouseout="toggleFlip('${f.id}')">?</button>
                <button class="unselect-btn" onclick="event.stopPropagation(); removeLastFlowerOfType('${f.id}')">↺</button>
                <div class="card-inner">
                    <div class="card-front" style="background-color: ${f.color}">
                        <div class="white-cube"></div>
                        <img src="${f.img}" class="w-full h-24 object-contain pointer-events-none">
                        <p class="font-black italic text-[14px] uppercase">${f.name}</p>
                        <div class="multiplier" id="count-${f.id}">x0</div>
                    </div>
                    <div class="card-back"><p class="font-black text-[10px] uppercase mb-2">Meaning</p><p class="italic text-xs px-2">${f.meaning}</p></div>
                </div>`;
            card.onclick = () => {
                addFlower(f);
            };
            grid.appendChild(card);
        });

        function toggleFlip(id) { document.getElementById(`container-${id}`).classList.toggle('flipped'); }

        function addFlower(f) {
            if (bouquet.length >= MAX_FLOWERS) { showWarning(); return; }
            const instanceId = `flower-${Date.now()}`;
            
            const rot = (Math.random() - 0.5) * 40;
            const scale = 1;
            const mb = 0;
            const flip = 1;
            const zIndex = bouquet.length;

            bouquet.push({ ...f, instanceId, rot, scale, mb, flip, zIndex });
            const img = document.createElement('img');
            img.src = f.img; img.id = instanceId; img.className = 'placed-flower';
            img.style.transform = `rotate(${rot}deg) scale(0.5) scaleX(${flip})`;
            img.style.opacity = "0";
            img.style.zIndex = zIndex;
            img.style.marginBottom = `${mb}px`;
            img.onclick = (e) => { e.stopPropagation(); removeFlower(instanceId); };
            document.getElementById('flower-layer').appendChild(img);
            setTimeout(() => { img.style.opacity = "1"; img.style.transform = `rotate(${rot}deg) scale(${scale}) scaleX(${flip})`; }, 50);
            updateUI();
        }

        function removeFlower(instanceId) {
            bouquet = bouquet.filter(f => f.instanceId !== instanceId);
            document.getElementById(instanceId)?.remove();
            updateUI();
        }

        function removeLastFlowerOfType(flowerId) {
            const lastFlower = [...bouquet].reverse().find(f => f.id === flowerId);
            if (lastFlower) {
                removeFlower(lastFlower.instanceId);
            }
        }

        function updateUI() {
            document.getElementById('flower-counter').textContent = `FLOWERS: ${bouquet.length} / ${MAX_FLOWERS}`;
            FLOWERS.forEach(f => {
                const count = bouquet.filter(item => item.id === f.id).length;
                const container = document.getElementById(`container-${f.id}`);
                const badge = document.getElementById(`count-${f.id}`);
                if (count > 0) { container.classList.add('selected-card'); badge.textContent = `x${count}`; }
                else { container.classList.remove('selected-card'); }
            });
        }

        function arrangeEverything() {
            const flowers = document.querySelectorAll('.placed-flower');
            flowers.forEach((img) => {
                const rotate = (Math.random() - 0.5) * 90; 
                const scale = 0.9 + (Math.random() * 0.35); 
                const mb = (Math.random() * 35);
                const flip = Math.random() > 0.5 ? -1 : 1;
                const zIndex = Math.floor(Math.random() * 20); 
                
                img.style.zIndex = zIndex; 
                img.style.transform = `rotate(${rotate}deg) scale(${scale}) scaleX(${flip})`;
                img.style.marginBottom = `${mb}px`;

                const flowerObj = bouquet.find(f => f.instanceId === img.id);
                if (flowerObj) {
                    flowerObj.rot = rotate;
                    flowerObj.scale = scale;
                    flowerObj.mb = mb;
                    flowerObj.flip = flip;
                    flowerObj.zIndex = zIndex;
                }
            });
        }

        function changeWrap() {
            wrapIdx = (wrapIdx % 6) + 1;
            document.getElementById('wrap-back-img').src = `imgs/wrap_back_${wrapIdx}.svg`;
            document.getElementById('wrap-front-img').src = `imgs/wrap_front_${wrapIdx}.svg`;
        }

        function toggleMessage() { document.getElementById('main-builder').classList.toggle('show-msg'); }
        function scrollToBuilder() { document.getElementById('builder-section').scrollIntoView({ behavior: 'smooth' }); }
        function showWarning() { const w = document.getElementById('limit-warning'); w.classList.remove('hidden'); setTimeout(() => w.classList.add('hidden'), 2000); }
        function resetBouquet() { bouquet = []; document.getElementById('flower-layer').innerHTML = ''; updateUI(); }

        function goToPreview() {
            if (bouquet.length === 0) { alert("Please add some flowers first!"); return; }
            
            const flowerData = bouquet.map(f => 
                `${f.id}|${f.rot.toFixed(1)}|${f.scale.toFixed(2)}|${f.mb.toFixed(1)}|${f.flip}|${f.zIndex}`
            ).join(',');

            const data = {
                f: flowerData,
                w: wrapIdx,
                to: document.getElementById('msg-to').value,
                m: document.getElementById('msg-body').value,
                fr: document.getElementById('msg-from').value
            };

            // Encode the data to be URL-safe
            const encodedData = btoa(encodeURIComponent(JSON.stringify(data)));
            window.location.href = `preview.html?data=${encodedData}`;
        }
    </script>
</body>
</html>
